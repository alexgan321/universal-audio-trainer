table { width: 100%; border-collapse: collapse; text-align: left; font-size: 15px; }

th:first-child, td:first-child { border-left: 1px solid #e5e7eb; }
th { background-color: #4a76a8; color: white; font-weight: bold; border-right: 1px solid rgba(255, 255, 255, 0.2); }
tbody tr:nth-of-type(odd) { background: #ffffff; }
tbody tr:nth-of-type(even) { background: #f5f7fa; }
th:last-child { border-right: none; } 
.menu-th { width: 50px; text-align: center; padding: 0; user-select: none; }
tr { transition: background-color 0.3s; }
tr.playing-now { background-color: #fef08a !important; }
.clickable-word { color: #3b82f6; cursor: pointer; text-decoration: underline; }
.clickable-word:hover { color: #1d4ed8; background-color: #eff6ff; }

.modal-body li { margin-bottom: 12px; }
.modal-footer { padding: 12px; text-align: center; border-top: 1px solid #e5e7eb; }
.btn-understand { background-color: #4a76a8; color: white; border: none; padding: 10px 30px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 13px; }

<script>
var loadedWords = [];
var loadedData = [];
var trainerTimeout = null;
var isTrainerRunning = false;
var originalHeaderTitle = "Тема";

"<b>Готовим списки слов:</b> Список с транскрипцией: Слово - Траскрипция - Перевод; Список без транскрипции: Слово - Перевод. Сохраняем в .txt.",

function toggleDropdown(e) {
  if (e) { e.preventDefault(); e.stopPropagation(); }
  var menu = document.getElementById('mainDropdownMenu');
  if (!menu) return;
  var btn = e.currentTarget || e.target;
  var rect = btn.getBoundingClientRect();
  menu.style.position = 'fixed';
  menu.style.top = rect.bottom + 'px';
  menu.style.left = rect.left + 'px';
  menu.classList.toggle('show');
}

window.addEventListener('click', function() {
  var menu = document.getElementById('mainDropdownMenu');
  if(menu) menu.classList.remove('show');
});

document.getElementById('mainDropdownMenu').addEventListener('click', function(e) {
  if(e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT' || e.target.closest('.menu-label')) {
    e.stopPropagation();
  }
});

function toggleInstructionModal(show) {
  document.getElementById('instructionModal').style.display = show ? 'flex' : 'none';
}

function speak(text, onEndCallback) {
  if (!text) return;
  window.speechSynthesis.cancel();
  var utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = document.getElementById('langSelect').value;
  utterance.rate = parseFloat(document.getElementById('topSpeedRate').value);
  if (onEndCallback) { utterance.onend = onEndCallback; }
  window.speechSynthesis.speak(utterance);
}
// Конец Части 4

function startTrainer(mode) {
  if (loadedWords.length === 0) return;
  stopTrainer();
  isTrainerRunning = true;
  var menu = document.getElementById('mainDropdownMenu');
  if(menu) menu.classList.remove('show');
  var indexQueue = [];
  for (var i = 0; i < loadedWords.length; i++) { indexQueue.push(i); }
  if (mode === 'random') { indexQueue.sort(function() { return Math.random() - 0.5; }); }
  var currentQueuePosition = 0;
  function playNext() {
    if (!isTrainerRunning || currentQueuePosition >= indexQueue.length) { stopTrainer(); return; }
    var rows = document.querySelectorAll('#tableBody tr');
    rows.forEach(function(r) { r.classList.remove('playing-now'); });
    var targetIndex = indexQueue[currentQueuePosition];
    var targetRow = rows[targetIndex];
    var wordToSpeak = loadedWords[targetIndex];
    if (targetRow) {
      targetRow.classList.add('playing-now');
      targetRow.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
    speak(wordToSpeak, function() {
      currentQueuePosition++;
      trainerTimeout = setTimeout(playNext, 500);
    });
  }
  playNext();
}

function stopTrainer() {
  isTrainerRunning = false;
  clearTimeout(trainerTimeout);
  window.speechSynthesis.cancel();
  var rows = document.querySelectorAll('#tableBody tr');
  rows.forEach(function(r) { r.classList.remove('playing-now'); });
}

function updateTableStructure() {
  var headerRow = document.getElementById('headerRow');
  var format = document.querySelector('input[name="fileFormat"]:checked').value;
  while (headerRow.children.length > 1) { headerRow.removeChild(headerRow.lastChild); }
  var th1 = document.createElement('th'); th1.innerText = "Иностранное слово";
  headerRow.appendChild(th1);
  if (format === 'with-trans') { var th2 = document.createElement('th'); th2.innerText = "Транскрипция"; headerRow.appendChild(th2); }
  var th3 = document.createElement('th'); th3.innerText = "Перевод";
  headerRow.appendChild(th3);
  renderTableBody();
}

function renderTableBody() {
  var tableBody = document.getElementById('tableBody'); if (!tableBody) return;
  tableBody.innerHTML = ''; loadedWords = [];
  var format = document.querySelector('input[name="fileFormat"]:checked').value; var num = 1;
  loadedData.forEach(function(item) {
    loadedWords.push(item.word); var tr = document.createElement('tr');
    if (format === 'with-trans') {
      tr.innerHTML = '<td style="text-align:center;color:#666;font-size:14px;">' + num + '</td>' +
      '<td><span class="clickable-word" onclick="speak(\'' + item.word.replace(/'/g, "\\'") + '\')"><b>' + item.word + '</b></span></td>' +
      '<td class="transcription">' + item.trans + '</td>' +
      '<td>' + item.translation + '</td>';
    } else {
      tr.innerHTML = '<td style="text-align:center;color:#666;font-size:14px;">' + num + '</td>' +
      '<td><span class="clickable-word" onclick="speak(\'' + item.word.replace(/'/g, "\\'") + '\')"><b>' + item.word + '</b></span></td>' +
      '<td>' + item.translation + '</td>';
    }
    tableBody.appendChild(tr); num++;
  });
  var hasData = loadedData.length > 0;
  document.getElementById('btnSequence').disabled = !hasData;
  document.getElementById('btnRandom').disabled = !hasData;
  document.getElementById('btnArchive').disabled = !hasData;
}

  rows.forEach(function(row, idx) {
    var firstCell = row.querySelector('td'); var wordCell = firstCell.nextElementSibling;
    var transCell = wordCell.nextElementSibling; var translationCell = transCell.nextElementSibling;
    var num = idx + 1; var wordText = wordCell.innerText.trim(); var escapedWord = wordText.replace(/'/g, "\\\\'");
    htmlContent += "<tr><td style='text-align:center; color:#666;'>" + num + "</td><td><span class='clickable-word' onclick=\"speak('" + escapedWord + "', this.parentNode.parentNode)\">" + wordText + "</span></td>";
    if (currentFormat === 'with-trans' && translationCell) { htmlContent += "<td class='transcription'>" + transCell.innerText.trim() + "</td><td>" + translationCell.innerText.trim() + "</td>"; }
    else { htmlContent += "<td>" + transCell.innerText.trim() + "</td>"; }
    htmlContent += "</tr>";
  });

  htmlContent += "</tbody></table></div></div><div id='instModal' class='modal-overlay'><div class='modal-content'><div class='modal-header'><h2>Инструкция</h2><button class='modal-close-x' onclick='toggleModal(false)'>×</button></div><div class='modal-body'><ol><li><b>Ручной режим:</b> Кликайте по словам для озвучки.</li><li><b>Авто:</b> Кнопки 'По порядку' или 'Случайно' в меню ☰.</li><li><b>Стоп:</b> Кнопка 'Стоп'.</li><li><b>Понимание слов:</b> Вы говорите перевод услышанного слова члену семьи или другу и он контролирует по таблице.</li></ol></div><div class='modal-footer'><button class='btn-understand' onclick='toggleModal(false)'>Понятно</button></div></div></div>";

  var wordsArray = []; 
  rows.forEach(function(row) { 
    var firstCell = row.querySelector('td'); 
    wordsArray.push(firstCell.nextElementSibling.innerText.trim()); 
  });

  var scriptCode = "var tTimeout = null; var isRunning = false;\n" +
    "var rawWords = " + JSON.stringify(wordsArray) + ";\n" +
    "function speak(t, row) { window.speechSynthesis.cancel(); if(row) { document.querySelectorAll('tbody tr').forEach(e=>e.classList.remove('playing-now')); row.classList.add('playing-now'); } var u = new SpeechSynthesisUtterance(t); u.lang = '" + selectedLang + "'; u.rate = document.getElementById('archSpeedRate').value; window.speechSynthesis.speak(u); }\n" +
    "function toggleMenu(e, btn) { if(e) { e.preventDefault(); e.stopPropagation(); } var el = document.getElementById('archDropdownMenu'); if(!el) return; var rect = btn.getBoundingClientRect(); el.style.position = 'fixed'; el.style.top = rect.bottom + 'px'; el.style.left = rect.left + 'px'; el.classList.toggle('show'); }\n" +
    "window.onclick = function() { var e = document.getElementById('archDropdownMenu'); if(e) e.classList.remove('show'); };\n" +
    "function toggleModal(show) { document.getElementById('instModal').style.display = show ? 'flex' : 'none'; }\n" +
    "function startAuto(mode) { stopAuto(); isRunning = true; var queue = []; for(var i=0; i<rawWords.length; i++) queue.push(i); if(mode === 'random') queue.sort(function(){ return Math.random() - 0.5; }); var pos = 0; function play() { if(!isRunning || pos >= queue.length) { stopAuto(); return; } document.querySelectorAll('tbody tr').forEach(e=>e.classList.remove('playing-now')); var idx = queue[pos]; var rows = document.querySelectorAll('tbody tr'); if(rows[idx]) { rows[idx].classList.add('playing-now'); rows[idx].scrollIntoView({ behavior: 'smooth', block: 'nearest' }); } window.speechSynthesis.cancel(); var utterance = new SpeechSynthesisUtterance(rawWords[idx]); utterance.lang = '" + selectedLang + "'; utterance.rate = document.getElementById('archSpeedRate').value; utterance.onend = function() { pos++; tTimeout = setTimeout(play, 500); }; window.speechSynthesis.speak(utterance); } play(); }\n" +
    "function stopAuto() { isRunning = false; clearTimeout(tTimeout); window.speechSynthesis.cancel(); document.querySelectorAll('tbody tr').forEach(e=>e.classList.remove('playing-now')); }";

  htmlContent += "<script>" + scriptCode + "</" + "script></body></html>";

  var n = new Date(); var dt = ("0" + n.getDate()).slice(-2) + "-" + ("0" + (n.getMonth() + 1)).slice(-2) + "-" + n.getFullYear();
  var blob = new Blob([htmlContent], {type: "text/html;charset=utf-8"});
  var link = document.createElement('a'); link.href = URL.createObjectURL(blob);
  link.download = userFileName + "_" + dt + ".html"; document.body.appendChild(link); link.click(); document.body.removeChild(link);
}

document.getElementById('fileInput').addEventListener('change', function(e) {
  var file = e.target.files.item(0); if (!file) return; stopTrainer(); var reader = new FileReader();
  reader.onload = function(evt) {
    var content = evt.target.result; 
    var lines = content.split(/\r?\n/).map(function(line) {
      return line.replace(/\\n/g, '').replace(/\\r/g, '').trim();
    }).filter(function(line) { return line.length > 0; });
    
    loadedData = [];
    if (lines.length > 0) {
      originalHeaderTitle = lines.shift(); 
      var firstLine = originalHeaderTitle.toLowerCase(); var sel = document.getElementById('langSelect');
      if (firstLine.indexOf('английский') !== -1 || firstLine.indexOf('сша') !== -1 || firstLine.indexOf('english') !== -1) sel.value = 'en-US';
      else if (firstLine.indexOf('великобритания') !== -1 || firstLine.indexOf('британский') !== -1) sel.value = 'en-GB';
      else if (firstLine.indexOf('французский') !== -1) sel.value = 'fr-FR';
      else if (firstLine.indexOf('немецкий') !== -1) sel.value = 'de-DE';
      else if (firstLine.indexOf('испанский') !== -1) sel.value = 'es-ES';
      else if (firstLine.indexOf('итальянский') !== -1) sel.value = 'it-IT';
      else if (firstLine.indexOf('китайский') !== -1) sel.value = 'zh-CN';
    }
    lines.forEach(function(line) {
      var trimmed = line.trim(); if (trimmed.length === 0) return; trimmed = trimmed.split(' - ').join('-'); var parts = trimmed.split('-');
      if (parts.length >= 3) { var w = parts.shift().trim(); var trc = parts.shift().trim(); var tl = parts.join('-').trim(); loadedData.push({ word: w, trans: trc, translation: tl }); }
      else if (parts.length >= 2) { var w = parts.shift().trim(); var tl = parts.join('-').trim(); loadedData.push({ word: w, trans: '', translation: tl }); }
    });
    updateTableStructure(); if (loadedData.length === 0) { alert('Ошибка чтения.'); }
    var menu = document.getElementById('mainDropdownMenu'); if(menu) menu.classList.remove('show');
  };
  reader.readAsText(file, 'UTF-8'); this.value = '';
});

window.addEventListener('DOMContentLoaded', function() {
  updateTableStructure(); var list = document.getElementById('instructionList');
  if(list) { instructionData.forEach(function(t) { var li = document.createElement('li'); li.innerHTML = t; list.appendChild(li); }); }
});

document.addEventListener('DOMContentLoaded', function() {
  var container = document.querySelector('.table-container');
  if(container) { container.addEventListener('scroll', function() { var menu = document.getElementById('mainDropdownMenu'); if(menu) menu.classList.remove('show'); }); }
  window.addEventListener('scroll', function() { var menu = document.getElementById('mainDropdownMenu'); if(menu) menu.classList.remove('show'); });
});
</script>
</body>
<script>
// Блокируем вызов контекстного меню (правую кнопку мыши)
document.addEventListener('contextmenu', function(e) {
  e.preventDefault();
});

// Блокируем выделение текста на странице для защиты от копирования
document.addEventListener('selectstart', function(e) {
  e.preventDefault();
});

// Блокируем горячие клавиши сохранения и просмотра кода
document.addEventListener('keydown', function(e) {
  // Блокировка Ctrl + S (Сохранить)
  if ((e.ctrlKey || e.metaKey) && e.keyCode === 83) {
    e.preventDefault();
    alert('Сохранение этой страницы ограничено. Используйте кнопку "Сохранить тренажёр" в меню!');
    return false;
  }
  // Блокировка Ctrl + U (Просмотр исходного кода)
  if ((e.ctrlKey || e.metaKey) && e.keyCode === 85) {
    e.preventDefault();
    return false;
  }
  // Блокировка F12 и Ctrl + Shift + I (Панель разработчика)
  if (e.keyCode === 123 || (e.ctrlKey && e.shiftKey && e.keyCode === 73)) {
    e.preventDefault();
    return false;
  }
});
</script>
